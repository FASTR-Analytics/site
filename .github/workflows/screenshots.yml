name: Screenshots

# Recaptures the docs screenshots from a demo instance of the platform and
# commits the images that changed straight to main, as the platform's docs sync
# does. See screenshots/README.md.

on:
  # After the platform's docs sync updates the guides.
  push:
    branches: [main]
    paths:
      - "src/content/docs/admin-guide/**"
      - "src/content/docs/user-guide/**"
      - "src/content/docs/fr/admin-guide/**"
      - "src/content/docs/fr/user-guide/**"
  # Weekly, to catch interface changes the docs sync didn't touch.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      platform_ref:
        description: "Platform branch, tag or commit to capture"
        default: main
      shots:
        description: 'Shot names (comma-separated) or "all". "ai-panel" only runs when named and needs the ANTHROPIC_API_KEY secret.'
        default: all

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    # On a push, only the docs sync bot's commits: a person editing wording doesn't need new screenshots.
    if: "github.event_name != 'push' || startsWith(github.event.head_commit.message, 'docs: sync documentation')"
    # Pinned: Playwright 1.57 has no browser build for newer Ubuntu runner images.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # Checked out side by side: the platform must not sit inside the site repo,
      # or Vite picks up the site's Astro tsconfig.json and the client fails to compile.
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Check out the platform
        uses: actions/checkout@v4
        with:
          repository: FASTR-Analytics/platform
          ref: ${{ inputs.platform_ref || 'main' }}
          path: platform

      - name: Check out the module definitions
        uses: actions/checkout@v4
        with:
          repository: FASTR-Analytics/modules
          path: modules

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            platform/client/package-lock.json
            site/screenshots/package-lock.json

      - name: Cache the platform's Deno and npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            platform/node_modules
          key: platform-deps-${{ hashFiles('platform/deno.lock') }}
          restore-keys: platform-deps-

      - name: Install
        run: |
          npm ci --prefix platform/client --no-audit --no-fund
          npm ci --prefix site/screenshots --no-audit --no-fund
          (cd site/screenshots && npx playwright-core install --with-deps chromium-headless-shell)
          pip install pillow

      - name: Boot the demo instance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOTS_MODULES_DIR: modules
        run: |
          node site/screenshots/prepare_platform.mjs platform
          bash site/screenshots/boot.sh platform
          node site/screenshots/labels.mjs platform

      - name: Capture
        run: |
          SHOTS="${{ inputs.shots || 'all' }}"
          node site/screenshots/capture.mjs en "$SHOTS" || true
          node site/screenshots/capture.mjs fr "$SHOTS" || true
          python3 site/screenshots/postprocess.py

      - name: Commit the changed images to main
        run: |
          cd site/screenshots
          FAILED=$(node -e "const fs=require('fs');const f=['en','fr'].flatMap(l=>{try{return JSON.parse(fs.readFileSync('out/raw/_failed-'+l+'.json')).map(s=>s+' ('+l+')')}catch{return []}});console.log(f.join(', '))")
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"
          if [ ! -s out/changed.txt ]; then
            echo "No screenshot changed."
            exit 0
          fi
          cd ..
          PLATFORM_SHA=$(git -C ../platform rev-parse --short HEAD)
          PLATFORM_VERSION=$(cat ../platform/VERSION)
          # The commit message is the run's record: what changed, what could not
          # be captured, and where the raw captures are.
          {
            echo "Update docs screenshots from platform $PLATFORM_VERSION ($PLATFORM_SHA)"
            echo
            echo "Only images whose pixels changed are included."
            echo
            echo "Changed images:"
            sed 's/^/- /' screenshots/out/changed.txt
            if [ -n "$FAILED" ]; then
              echo
              echo "Shots that could not be captured (the interface probably changed; update screenshots/capture.mjs): $FAILED"
            fi
            echo
            echo "Raw captures and logs: the screenshots artifact of ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/commit_msg.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/images
          git commit -q -F /tmp/commit_msg.txt
          # Rebase over anything that landed since checkout, then push.
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "Pushed $(git rev-parse --short HEAD) to main"

      - name: Upload raw captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            site/screenshots/out/
            platform/_screenshots_data/*.log
          retention-days: 14

      - name: Report shots that could not be captured
        if: env.FAILED != ''
        run: |
          echo "::error::Could not capture: ${FAILED}. The interface probably changed; update screenshots/capture.mjs."
          exit 1

      - name: Stop the demo instance
        if: always()
        run: bash site/screenshots/stop.sh platform || true
