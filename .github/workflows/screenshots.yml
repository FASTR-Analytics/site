name: Screenshots

# Recaptures the docs screenshots from a demo instance of the platform and opens a
# pull request with the images that changed. See screenshots/README.md.

on:
  # After the platform's docs sync updates the guides.
  push:
    branches: [main]
    paths:
      - "src/content/docs/admin-guide/**"
      - "src/content/docs/user-guide/**"
      - "src/content/docs/fr/admin-guide/**"
      - "src/content/docs/fr/user-guide/**"
  # Weekly, to catch interface changes the docs sync didn't touch.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      platform_ref:
        description: "Platform branch, tag or commit to capture"
        default: main
      shots:
        description: 'Shot names (comma-separated) or "all". "ai-panel" only runs when named and needs the ANTHROPIC_API_KEY secret.'
        default: all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  capture:
    # On a push, only the docs sync bot's commits: a person editing wording doesn't need new screenshots.
    if: "github.event_name != 'push' || startsWith(github.event.head_commit.message, 'docs: sync documentation')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check out the platform
        uses: actions/checkout@v4
        with:
          repository: FASTR-Analytics/platform
          ref: ${{ inputs.platform_ref || 'main' }}
          path: _platform

      - name: Check out the module definitions
        uses: actions/checkout@v4
        with:
          repository: FASTR-Analytics/modules
          path: _modules

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            _platform/client/package-lock.json
            screenshots/package-lock.json

      - name: Cache the platform's Deno and npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            _platform/node_modules
          key: platform-deps-${{ hashFiles('_platform/deno.lock') }}
          restore-keys: platform-deps-

      - name: Install
        run: |
          npm ci --prefix _platform/client --no-audit --no-fund
          npm ci --prefix screenshots --no-audit --no-fund
          (cd screenshots && npx playwright-core install --with-deps chromium-headless-shell)
          pip install pillow

      - name: Boot the demo instance
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOTS_MODULES_DIR: _modules
        run: |
          node screenshots/prepare_platform.mjs _platform
          bash screenshots/boot.sh _platform
          node screenshots/labels.mjs _platform

      - name: Capture
        run: |
          SHOTS="${{ inputs.shots || 'all' }}"
          node screenshots/capture.mjs en "$SHOTS" || true
          node screenshots/capture.mjs fr "$SHOTS" || true
          python3 screenshots/postprocess.py

      - name: Open a pull request with the changed images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          FAILED=$(node -e "const fs=require('fs');const f=['en','fr'].flatMap(l=>{try{return JSON.parse(fs.readFileSync('out/raw/_failed-'+l+'.json')).map(s=>s+' ('+l+')')}catch{return []}});console.log(f.join(', '))")
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"
          if [ ! -s out/changed.txt ]; then
            echo "No screenshot changed."
            exit 0
          fi
          cd ..
          PLATFORM_SHA=$(git -C _platform rev-parse --short HEAD)
          PLATFORM_VERSION=$(cat _platform/VERSION)
          BRANCH="screenshots/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/images
          git commit -q -m "Update docs screenshots from platform $PLATFORM_VERSION ($PLATFORM_SHA)"
          git push -q origin "$BRANCH"
          {
            echo "Screenshots recaptured from a demo instance of platform **$PLATFORM_VERSION** (\`$PLATFORM_SHA\`)."
            echo
            echo "Only images whose pixels changed are included. Check them in the **Files changed** tab before merging."
            echo
            echo "**Changed images**"
            sed 's/^/- /' screenshots/out/changed.txt
            if [ -n "$FAILED" ]; then
              echo
              echo "**Shots that could not be captured** (the interface probably changed; update \`screenshots/capture.mjs\`): $FAILED"
            fi
            echo
            echo "Raw captures and logs: the \`screenshots\` artifact of [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > /tmp/pr_body.md
          gh label create screenshots --color 0E8A16 --description "Automated screenshot updates" --force >/dev/null 2>&1 || true
          # Supersede earlier screenshot PRs that are still open.
          for n in $(gh pr list --label screenshots --state open --json number -q '.[].number'); do
            gh pr close "$n" --delete-branch --comment "Superseded by a newer screenshot run." || true
          done
          gh pr create --base main --head "$BRANCH" --label screenshots \
            --title "Docs screenshots: platform $PLATFORM_VERSION" --body-file /tmp/pr_body.md \
          || echo "::warning::Could not open the pull request (Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests' may be off). Open it here: ${{ github.server_url }}/${{ github.repository }}/compare/main...$BRANCH?expand=1"

      - name: Upload raw captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots/out/
            _platform/_screenshots_data/*.log
          retention-days: 14

      - name: Report shots that could not be captured
        if: env.FAILED != ''
        run: |
          echo "::error::Could not capture: ${FAILED}. The interface probably changed; update screenshots/capture.mjs."
          exit 1

      - name: Stop the demo instance
        if: always()
        run: bash screenshots/stop.sh _platform || true
